spring.application.name=play-your-list

server.port=8080

# H2
spring.datasource.url=jdbc:h2:mem:playyourlist
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.defer-datasource-initialization=true

# Como os 4 "microservicos" (musicas, playlists, reproducoes, api) vivem no
# mesmo projeto/porta (ver README-ms.md), o modulo api usa Open Feign para
# chamar os demais endpoints via HTTP, apontando para o proprio host:porta.
# Em uma implantacao real, cada servico teria sua propria URL/porta aqui.
app.musicas.url=http://localhost:8080
app.playlists.url=http://localhost:8080
app.reproducoes.url=http://localhost:8080
